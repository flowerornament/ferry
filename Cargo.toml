[package]
name = "ferry"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
fs2 = "0.4.3"
glob = "0.3.4"
nix = { version = "0.31.3", features = ["signal", "process", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
signal-hook = "0.4.5"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.6"

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14.11"
