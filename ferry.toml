version = 1

[recipe.smoke]
command = ["sh", "-c", "echo ferry-smoke-ok"]
requires = []
routable = true

# Arguments after `--` reach cargo test as literal argv, for a focused
# control: `ferry run test --on <host> --commit <rev> -- --test session_contract <filter>`.
[recipe.test]
command = ["sh", "-c", "command -v nix >/dev/null || . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh; exec nix develop -c cargo test --locked --no-fail-fast \"$@\"", "ferry-test"]
requires = []
routable = true

# The same gate as `just check`, in the flake's dev shell (jj, git, python3,
# procps, util-linux), for Linux-only code a Mac never compiles.
[recipe.check]
command = ["sh", "-c", "command -v nix >/dev/null || . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh; exec nix develop -c just check"]
requires = []
routable = true

[recipe.fail]
command = ["sh", "-c", "echo recipe-failure; exit 17"]
requires = []
routable = true
