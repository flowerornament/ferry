name: Nix Cache

on:
  push:
    branches: [main]

permissions:
  contents: read

# One queued build per branch: a newer push replaces a queued one, saving
# runner minutes. A release commit's build has a group of its own, so the
# next push can never cancel it (v0.1.5's was, at 408eb0c1).
concurrency:
  group: nix-cache-${{ startsWith(github.event.head_commit.message, 'release:') && github.sha || github.ref }}
  cancel-in-progress: false

jobs:
  cache:
    uses: ./.github/workflows/nix-cache-package.yml
    with:
      executable: ferry
      matrix: >-
        [
          {"system":"aarch64-darwin","runner":"macos-15"},
          {"system":"aarch64-linux","runner":"ubuntu-24.04-arm"},
          {"system":"x86_64-linux","runner":"ubuntu-24.04"}
        ]
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
